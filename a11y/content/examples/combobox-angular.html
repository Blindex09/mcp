<!--
  Angular Aria combobox — Angular 21+ (2026)
  @angular/aria/combobox + @angular/cdk/overlay
  Directives: ngCombobox, ngComboboxInput, ngComboboxPopupContainer,
              ngListbox, ngOption

  The library wires role="combobox", aria-haspopup, aria-expanded,
  aria-controls, aria-activedescendant, keyboard nav, and focus.
  You provide the HTML structure and CSS.
-->
<div class="day-selection">
  <h2 id="week-label" class="day-selection__title">This Week</h2>

  <!-- Combobox container: coordinates input + popup, manages open/close,
       keyboard, and ARIA roles. readonly prevents free text entry. -->
  <div ngCombobox readonly>
    <!-- Combobox input: the trigger. aria-labelledby associates the input
         with both the heading and the selected value span for an accessible name. -->
    <div #trigger class="day-selection__select-trigger">
      <span id="day-value" class="day-selection__select-value">
        {{ day() }}
      </span>
      <input type="text"
        ngComboboxInput
        aria-labelledby="week-label day-value"
        class="day-selection__select-input" />
      <!-- The arrow is purely visual; state is conveyed by aria-expanded.
           Hide it from assistive tech with aria-hidden. -->
      <span class="day-selection__select-arrow" aria-hidden="true">▼</span>
    </div>

    <!-- Popup container: marks where the popup content lives and keeps
         correct ARIA relationships between trigger and popup. -->
    <ng-template ngComboboxPopupContainer>
      <ng-template
        [cdkConnectedOverlay]="{ origin: trigger, usePopover: 'inline', matchWidth: true }"
        [cdkConnectedOverlayOpen]="true">
        <!-- Listbox: an ordered list because day order matters.
             aria-label gives the listbox an accessible name. -->
        <ol
          ngListbox
          [(values)]="selectedDay"
          aria-label="Available days"
          class="day-selection__select-popup">
          @for (day of days(); track day.value) {
            <li
              ngOption
              [value]="day.value"
              [label]="day.label"
              class="day-selection__select-option">
              <span class="day-selection__select-option-check" aria-hidden="true">✓</span>
              <span class="day-selection__select-option-day">{{ day.dayName }}</span>
              <span class="day-selection__select-option-date">{{ day.label }}</span>
            </li>
          }
        </ol>
      </ng-template>
    </ng-template>
  </div>
</div>
