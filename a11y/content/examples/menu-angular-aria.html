<!--
  Angular Aria menu + menubar + submenu (Angular 21, 2026)
  @angular/aria/menu, @angular/aria/menubar

  The directives wire role="menu"/"menubar"/"menuitem", aria-haspopup,
  aria-expanded, aria-controls, keyboard nav (arrows, Home/End, Enter/Escape),
  RTL, and focus management. You provide HTML + CSS + business logic.
-->

<!-- ============ MENU (dropdown) with submenu ============ -->
<!-- ngMenuTrigger on a <button> wires aria-haspopup, aria-expanded, aria-controls. -->
<button type="button" ngMenuTriggerFor="fileMenu" aria-label="File menu">File ▾</button>

<!-- ngMenu = role="menu". ngMenuItem = role="menuitem". -->
<ng-template #fileMenu ngMenu>
  <button type="button" ngMenuItem (click)="newFile()">New</button>
  <button type="button" ngMenuItem (click)="openFile()">Open…</button>

  <!-- Submenu: ngMenuTriggerFor on a ngMenuItem opens a nested menu.
       ArrowRight opens, ArrowLeft closes, aria-haspopup + aria-expanded auto-applied. -->
  <button type="button" ngMenuItem ngMenuTriggerFor="shareMenu">Share ▸</button>

  <div role="separator" aria-hidden="true" style="height:1px;background:#eee;margin:4px 0"></div>

  <button type="button" ngMenuItem disabled>Print…</button>
</ng-template>

<ng-template #shareMenu ngMenu>
  <button type="button" ngMenuItem (click)="shareEmail()">Email</button>
  <button type="button" ngMenuItem (click)="shareLink()">Copy link</button>
</ng-template>

<!-- ============ MENUBAR (horizontal, persistent) ============ -->
<!-- ngMenuBar = role="menubar". Items use roving tabindex (only one in Tab order).
     Arrow keys move between top-level items; Enter/Space/ArrowDown opens submenus. -->
<nav ngMenuBar aria-label="Application menu">
  <button type="button" ngMenuItem ngMenuTriggerFor="editMenu">Edit</button>
  <button type="button" ngMenuItem ngMenuTriggerFor="viewMenu">View</button>
  <button type="button" ngMenuItem ngMenuTriggerFor="helpMenu">Help</button>
</nav>

<ng-template #editMenu ngMenu>
  <button type="button" ngMenuItem (click)="undo()">Undo</button>
  <button type="button" ngMenuItem (click)="redo()">Redo</button>
</ng-template>

      <button type="button" mat-menu-item>Edit</button>
      <button type="button" mat-menu-item [matMenuTriggerFor]="share">Share</button>
      <button type="button" mat-menu-item disabled>Print</button>
