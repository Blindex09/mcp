<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCAG 2.2 Accessible Form (SC 3.3.7 &amp; SC 3.3.8)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #fafafa; }
    .form-card { max-width: 500px; padding: 1.5rem; background: white; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
    input[type="text"] { width: 100%; padding: 0.5rem; border: 1px solid #777; border-radius: 4px; box-sizing: border-box; }
    input:focus-visible { outline: 3px solid #005fcc; }
    [role="alert"] { background: #fde8e8; border: 1px solid #e02424; color: #9b1c1c; padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
    [role="alert"]:focus { outline: 3px solid #9b1c1c; }
  </style>
</head>
<body>

  <main class="form-card">
    <h1>Multi-Step Order Form</h1>

    <!-- Focusable Error Summary Container -->
    <div id="error-summary" role="alert" tabindex="-1" style="display: none;"></div>

    <form id="checkout-form" novalidate>
      <fieldset>
        <legend>Shipping Address</legend>
        <div class="form-group">
          <label for="shipping-address">Address</label>
          <input type="text" id="shipping-address" name="shippingAddress" required>
        </div>
      </fieldset>

      <fieldset style="margin-top: 1.5rem;">
        <legend>Billing Address (WCAG 2.2 SC 3.3.7 No Redundant Entry)</legend>
        
        <div class="form-group" style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="checkbox" id="same-as-shipping">
          <label for="same-as-shipping" style="font-weight: normal; margin-bottom: 0;">Same as shipping address</label>
        </div>

        <div class="form-group">
          <label for="billing-address">Billing Address</label>
          <input type="text" id="billing-address" name="billingAddress" required>
        </div>
      </fieldset>

      <!-- SC 3.3.8 Accessible Authentication: Paste MUST NOT be blocked -->
      <div class="form-group" style="margin-top: 1.5rem;">
        <label for="otp-code">Verification Code (Paste Allowed - SC 3.3.8)</label>
        <input type="text" id="otp-code" name="otp" autocomplete="one-time-code" required>
      </div>

      <button type="submit" style="padding: 0.75rem 1.5rem; background: #005fcc; color: white; border: none; font-size: 1rem; cursor: pointer;">
        Complete Order
      </button>
    </form>
  </main>

  <script>
    const shippingInput = document.getElementById('shipping-address');
    const billingInput = document.getElementById('billing-address');
    const sameCheckbox = document.getElementById('same-as-shipping');
    const form = document.getElementById('checkout-form');
    const errorSummary = document.getElementById('error-summary');

    // SC 3.3.7 Redundant Entry Auto-Population
    sameCheckbox.addEventListener('change', () => {
      if (sameCheckbox.checked) {
        billingInput.value = shippingInput.value;
      } else {
        billingInput.value = '';
      }
    });

    // Form Submission & Focusable Error Summary
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const errors = [];

      if (!shippingInput.value.trim()) {
        errors.push({ id: 'shipping-address', message: 'Shipping address is required.' });
      }
      if (!billingInput.value.trim()) {
        errors.push({ id: 'billing-address', message: 'Billing address is required.' });
      }

      if (errors.length > 0) {
        errorSummary.style.display = 'block';
        errorSummary.innerHTML = `
          <h2 style="margin-top:0; font-size: 1.1rem;">Please fix ${errors.length} error(s):</h2>
          <ul>
            ${errors.map(err => `<li><a href="#${err.id}">${err.message}</a></li>`).join('')}
          </ul>
        `;
        errorSummary.focus();
      } else {
        errorSummary.style.display = 'none';
        alert('Order submitted successfully!');
      }
    });
  </script>

</body>
</html>
