<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Accessible Carousel (2026)</title>
  <style>
    .carousel { position: relative; overflow: hidden; }
    .carousel-items { display: flex; transition: transform 0.3s; }
    .carousel-item { min-width: 100%; }
    .controls { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    button:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }
  </style>
</head>
<body>

<!--
  Accessible carousel — WAI-ARIA APG Carousel Pattern.

  Required attributes:
    - Container: aria-roledescription="carousel" + aria-label (name)
    - Each slide: role="group" + aria-roledescription="slide" + aria-label="1 of N"
    - Track: aria-live="off" when autoplay ON (don't interrupt), "polite" when paused
    - Prev/Next: aria-controls the track, aria-label="Previous Slide" / "Next Slide"
    - Pause/Play: aria-label toggles; aria-controls the track
    - Slide dots: role="tab"/role="tablist" variant, or buttons with aria-label

  Autoplay MUST pause on hover/focus and MUST respect prefers-reduced-motion.
  WCAG: 2.2.2 (Pause, Stop, Hide), 1.3.1, 4.1.2, 2.3.3.
-->
<section id="carousel" class="carousel" aria-roledescription="carousel" aria-label="Featured products">
  <div class="carousel-items" id="carousel-track" aria-live="off">

    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="1 of 3">
      <img src="slide-1.jpg" alt="Amsterdam walking tour" />
      <p>Amsterdam walking tour</p>
    </div>
    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 3" hidden>
      <img src="slide-2.jpg" alt="Tokyo street food" />
      <p>Tokyo street food</p>
    </div>
    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 3" hidden>
      <img src="slide-3.jpg" alt="Patagonia trek" />
      <p>Patagonia trek</p>
    </div>
  </div>

  <!-- APG requires the rotation (play/pause) control to be the FIRST element
       in the carousel's tab sequence. -->
  <div class="controls">
    <button type="button" id="playPause" aria-controls="carousel-track" aria-label="Pause autoplay" onclick="togglePlay()">⏸</button>
    <button type="button" aria-controls="carousel-track" aria-label="Previous Slide" onclick="move(-1)">◀</button>
    <button type="button" aria-controls="carousel-track" aria-label="Next Slide" onclick="move(1)">▶</button>
  </div>
</section>

<!-- Live region announces slide changes to screen readers. -->
<div id="carousel-announcer" aria-live="polite" class="sr-only"></div>

<script>
  const slides = Array.from(document.querySelectorAll('.carousel-item'));
  let current = 0;
  let playing = true;
  let timer = null;

  function goTo(n) {
    current = (n + slides.length) % slides.length;
    slides.forEach((s, i) => (s.hidden = i !== current));
    document.getElementById('carousel-announcer').textContent =
      `Slide ${current + 1} of ${slides.length}`;
  }
  const move = (d) => goTo(current + d);

  function togglePlay() {
    playing = !playing;
    const btn = document.getElementById('playPause');
    const track = document.getElementById('carousel-track');
    btn.setAttribute('aria-label', playing ? 'Pause autoplay' : 'Play autoplay');
    btn.textContent = playing ? '⏸' : '▶';
    track.setAttribute('aria-live', playing ? 'off' : 'polite');
    if (playing) start(); else stop();
  }

  function start() { stop(); timer = setInterval(() => goTo(current + 1), 5000); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }

  // Pause on hover/focus (WCAG 2.2.2).
  const carousel = document.getElementById('carousel');
  carousel.addEventListener('mouseenter', stop);
  carousel.addEventListener('mouseleave', () => playing && start());
  carousel.addEventListener('focusin', stop);
  carousel.addEventListener('focusout', () => playing && start());

  // Reduced motion MUST disable autoplay.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    playing = false;
    document.getElementById('playPause').setAttribute('aria-label', 'Play autoplay');
    document.getElementById('playPause').textContent = '▶';
  } else {
    start();
  }
</script>

</body>
</html>
