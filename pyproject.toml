[project]
name = "accessibility-mcp-server"
version = "2.0.0"
description = "Accessibility MCP Server - WCAG/ARIA guides, accessible component examples and axe-core auditing for Claude, VSCode and Cursor"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (process-level startup tests)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
