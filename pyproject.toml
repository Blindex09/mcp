[project]
name = "accessibility-mcp-server"
version = "2.2.0"
description = "Servidor MCP de acessibilidade digital: guias WCAG/ARIA, auditoria axe-core e teste como usuario (teclado, leitor de tela, mobile) com achados por criterio WCAG, evidencia e exportacao EARL/SARIF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "playwright>=1.49",
    "httpx>=0.27",
    "python-docx>=1.2,<2",
    "pypdf>=6,<7",
    "Pillow>=11,<13",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
telemetry = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp>=1.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "ruff>=0.16",
    "mypy>=2.0",
    "types-defusedxml>=0.7",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
accessibility-mcp = "accessibility_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (process-level startup tests)",
]

[tool.ruff]
target-version = "py310"
extend-exclude = ["accessibility_mcp/a11y/content", "accessibility_mcp/a11y/vendor"]

[tool.mypy]
python_version = "3.10"
files = ["accessibility_mcp", "mcp_server.py"]
exclude = ["accessibility_mcp/a11y/content/", "accessibility_mcp/a11y/vendor/"]

[[tool.mypy.overrides]]
# O NumPy e apenas uma dependencia opcional de tipagem do Pillow; seus stubs
# do Python 3.14 usam sintaxe posterior ao alvo 3.10 deste projeto.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["accessibility_mcp/**", "mcp_server.py"]
